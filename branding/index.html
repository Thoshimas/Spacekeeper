<main class="page"><div class="hero"><div><div class="eyebrow">SPACEKEEPER · APPLICATION ICON</div><h1>看清空間，留出餘裕。</h1><p>以資料夾收納每一份資料，將空間分布化為三個清楚的色塊。<br>鼠尾草綠、暖米色與陶土色，延續應用程式原有的溫度。</p><div class="pills"><span class="pill">桌面與開始功能表</span><span class="pill">EXE 與安裝程式</span><span class="pill">16–256 px 多尺寸 ICO</span></div></div><img src="spacekeeper.png" alt="Spacekeeper：資料夾、空間分布與新葉圖示"></div><section class="sizes" aria-label="各尺寸圖示預覽"><div class="size"><img src="spacekeeper.svg" width="16" height="16" alt="16 像素"><small>16 px</small></div><div class="size"><img src="spacekeeper.svg" width="24" height="24" alt="24 像素"><small>24 px</small></div><div class="size"><img src="spacekeeper.svg" width="32" height="32" alt="32 像素"><small>32 px</small></div><div class="size"><img src="spacekeeper.svg" width="48" height="48" alt="48 像素"><small>48 px</small></div><div class="size"><img src="spacekeeper.svg" width="64" height="64" alt="64 像素"><small>64 px</small></div><div class="size"><img src="spacekeeper.svg" width="128" height="128" alt="128 像素"><small>128 px</small></div></section><p class="note">向量原稿可持續縮放；Windows 圖示另提供 16、24、32、48、64、128、256 px 對應尺寸。</p><div class="footer"><span>少一點擁擠，多一點餘地。</span><span><a href="spacekeeper.svg">SVG 原稿 ↗</a>　<a href="spacekeeper.png">PNG 圖示 ↗</a></span></div></main></html>
